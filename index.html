<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فلترة إشعارات الائتمان والخصم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#6b7686;--bd:#dde3ec;--pr:#1f5fbf;--pr2:#e6efff;--ok:#157f4b;--okb:#e0f5ea;--wn:#b45309;--wnb:#fff1dc;--rd:#b42318;--rdb:#fde8e6;--hd:#e9eef7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161d;--card:#1b212b;--tx:#e6eaf1;--mu:#98a3b5;--bd:#2d3644;--pr:#6ea3f5;--pr2:#22324d;--ok:#5fd39b;--okb:#17352a;--wn:#f5b25b;--wnb:#3a2c16;--rd:#f4857b;--rdb:#3b1f1d;--hd:#252d3a}}
:root[data-theme="dark"]{--bg:#12161d;--card:#1b212b;--tx:#e6eaf1;--mu:#98a3b5;--bd:#2d3644;--pr:#6ea3f5;--pr2:#22324d;--ok:#5fd39b;--okb:#17352a;--wn:#f5b25b;--wnb:#3a2c16;--rd:#f4857b;--rdb:#3b1f1d;--hd:#252d3a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Cairo,Tahoma,Arial,sans-serif}
.wrap{max-width:1500px;margin:auto;padding:14px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px;font-weight:600}
input,select,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;width:100%}
button{cursor:pointer;width:auto}button.p{background:var(--pr);color:#fff;border-color:var(--pr);font-weight:700}
button:hover{filter:brightness(.95)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--bd);border-radius:99px;padding:4px 12px;cursor:pointer;user-select:none;background:var(--card)}
.chip.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}.st b{display:block;font-size:19px}.st span{font-size:12px;color:var(--mu)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.tw table{border-collapse:collapse;width:100%;min-width:1100px}
.tw th{background:var(--hd);text-align:right;padding:8px;font-size:12px;position:sticky;top:0;white-space:nowrap}
.tw td{padding:7px 8px;border-top:1px solid var(--bd);vertical-align:top}
tr.sel td{background:var(--pr2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.b{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.full{background:var(--okb);color:var(--ok)}.open{background:var(--rdb);color:var(--rd)}.partial{background:var(--wnb);color:var(--wn)}
mark{background:#ffe27a;color:#000;border-radius:3px;padding:0 2px}
input[type=checkbox]{width:17px;height:17px;padding:0}
.chip i{font-style:normal;margin-inline-start:6px;opacity:.7}
.mu{color:var(--mu)}.empty{padding:30px;text-align:center;color:var(--mu)}
#pa{display:none}
</style>
</head>
<body>
<div class="wrap">
 <h1>📑 نظام فلترة إشعارات الائتمان ومذكرات الخصم</h1>
 <div class="sub" id="src"></div>

 <div class="card">
  <div class="grid">
   <div><label>🔎 اسم العميل أو كوده</label><input id="q" list="cl" placeholder="اكتب جزء من الاسم أو الكود…" autocomplete="off"><datalist id="cl"></datalist></div>
   <div><label>حالة السداد (Settled)</label><select id="fs"><option value="all">الكل</option><option value="open">⛔ لسه متسددش (غير مسدد)</option><option value="full">✅ مسدد بالكامل</option><option value="partial">🟠 مسدد جزئياً</option><option value="paid">مسدد (كامل + جزئي)</option></select></div>
   <div><label>نوع الحركة</label><select id="fm"></select></div>
   <div><label>من تاريخ</label><input type="date" id="d1"></div>
   <div><label>إلى تاريخ</label><input type="date" id="d2"></div>
   <div><label>الترتيب</label><select id="so"><option value="dd">التاريخ ↓ الأحدث</option><option value="da">التاريخ ↑ الأقدم</option><option value="cu">اسم العميل</option><option value="am">القيمة ↓</option></select></div>
  </div>
  <div style="margin-top:10px" class="chips">
   <label style="margin:0">كلمات في الوصف:</label>
   <span class="chip" data-k="haf">حافز / حوافز</span><span class="chip" data-k="raf">رف</span><span class="chip" data-k="hzf">حذف</span>
   <span id="saved" class="chips"></span><input id="kw" placeholder="اكتب كلمة واضغط Enter للحفظ…" style="width:190px"><button id="addkw" title="حفظ الكلمة">＋ حفظ</button>
   <select id="km" style="width:auto"><option value="in">إظهار فقط</option><option value="ex">استبعاد</option></select>
   <button id="reset">↺ مسح الفلاتر</button>
   <button id="theme" title="الوضع">🌓</button>
   <label class="chip" style="margin:0;display:inline-block">📂 رفع شيت جديد<input id="up" type="file" accept=".xlsx,.xls" hidden></label>
  </div>
 </div>

 <div class="stats" id="stats"></div>

 <div class="bar" style="margin-bottom:8px">
  <div class="chips"><button id="selAll">☑ تحديد كل نتائج الفلتر</button><button id="selNone">☐ إلغاء التحديد</button><span class="mu" id="selc"></span></div>
  <div class="chips"><button id="pdf">⬇ تنزيل PDF (<span id="pc2">0</span>)</button><button class="p" id="print">🖨 طباعة المحدد (<span id="pc">0</span>)</button></div>
 </div>

 <div class="tw"><table><thead><tr>
  <th><input type="checkbox" id="chPage" title="تحديد الصفحة"></th><th>الرقم</th><th>نوع الحركة</th><th>التاريخ</th><th>الوصف</th><th>العميل</th><th>الكود</th><th>مدين</th><th>دائن</th><th>الحساب المقابل</th><th>رقم الفاتورة</th><th>القيمة المسددة</th><th>حالة الدفع</th>
 </tr></thead><tbody id="tb"></tbody></table><div id="em" class="empty" hidden>لا توجد نتائج مطابقة</div></div>
 <div class="bar" style="margin-top:10px"><span class="mu" id="pg"></span><div class="chips"><button id="pv">السابق</button><button id="nx">التالي</button></div></div>
</div>
<div id="pa"></div>

const $=id=>document.getElementById(id);
const num=v=>{if(v===null||v===undefined||v==='')return 0;const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n};
const fmt=n=>n?n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
const p2=n=>String(n).padStart(2,'0');
const fdt=t=>{const d=new Date(t);let h=d.getHours(),ap=h>=12?'م':'ص';h=h%12||12;return `${p2(d.getDate())}/${p2(d.getMonth()+1)}/${d.getFullYear()} ${p2(h)}:${p2(d.getMinutes())}:${p2(d.getSeconds())}${ap}`};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KW={haf:/(^|\s)(ال)?(حافز|حوافز)/,raf:/(^|\s)(ال)?رف(\s|$)/,hzf:/(^|\s)حذف/};

function build(raw){
 rows=raw.map((r,i)=>{const cr=num(r[7]),dr=num(r[8]),amt=cr||dr,sv=num(r[1]),st=r[0]==='Settled';
  return{i,sv,inv:r[2]||'',cn:r[4]||'',cc:r[5]||'',ct:r[6]||'',cr,dr,cust:r[9]||'',code:r[10]||'',typ:r[11]||'',desc:r[12]||'',t:new Date(r[13]).getTime(),mt:r[14]||'',no:r[15]||'',posted:r[3]||'',
   s:!st?'open':(sv>=amt-0.01?'full':'partial'),amt}});
 sel.clear();page=0;
 $('cl').innerHTML=[...new Set(rows.map(r=>r.cust))].sort().map(c=>`<option value="${esc(c)}">`).join('');
 $('fm').innerHTML='<option value="">الكل</option>'+[...new Set(rows.map(r=>r.mt))].filter(Boolean).sort().map(m=>`<option>${m}</option>`).join('');
 apply();
}
function apply(){
 const q=$('q').value.trim().toLowerCase(),fs=$('fs').value,fm=$('fm').value,d1=$('d1').value?new Date($('d1').value).getTime():0,d2=$('d2').value?new Date($('d2').value).getTime()+864e5:1e15,kw=$('kw').value.trim(),ex=$('km').value==='ex';
 view=rows.filter(r=>{
  if(q&&!(r.cust.toLowerCase().includes(q)||String(r.code).includes(q)))return false;
  if(fs==='paid'){if(r.s==='open')return false}else if(fs!=='all'&&r.s!==fs)return false;
  if(fm&&r.mt!==fm)return false;
  if(r.t<d1||r.t>=d2)return false;
  if(kws.size){const hit=[...kws].some(k=>k.startsWith('w:')?r.desc.includes(k.slice(2)):KW[k].test(r.desc));if(ex?hit:!hit)return false}
  return true});
 const so=$('so').value;
 view.sort((a,b)=>so==='dd'?b.t-a.t:so==='da'?a.t-b.t:so==='am'?b.amt-a.amt:a.cust.localeCompare(b.cust,'ar')||b.t-a.t);
 page=0;render();
}
function hl(s){let o=esc(s);[...kws].filter(k=>k.startsWith('w:')).forEach(k=>{const w=esc(k.slice(2));o=o.split(w).join(`<mark>${w}</mark>`)});return o}
function render(){
 const tot=Math.max(1,Math.ceil(view.length/PS));if(page>=tot)page=tot-1;
 const sl=view.slice(page*PS,page*PS+PS),L={open:'لسه',full:'مسدد',partial:'جزئي'};
 $('tb').innerHTML=sl.map(r=>`<tr class="${sel.has(r.i)?'sel':''}"><td><input type="checkbox" data-i="${r.i}" ${sel.has(r.i)?'checked':''}></td><td class="num">${esc(r.no)}</td><td>${esc(r.mt)}</td><td class="num">${fdt(r.t)}</td><td>${hl(r.desc)}</td><td>${esc(r.cust)}</td><td class="num">${esc(r.code)}</td><td class="num">${fmt(r.dr)}</td><td class="num">${fmt(r.cr)}</td><td>${esc(r.cc)}</td><td class="num">${esc(r.inv)}</td><td class="num">${fmt(r.sv)}</td><td><span class="b ${r.s}">${L[r.s]}</span></td></tr>`).join('');
 $('em').hidden=view.length>0;
 const sum=a=>a.reduce((x,r)=>x+r.amt,0),op=view.filter(r=>r.s==='open');
 $('stats').innerHTML=[[view.length,'عدد الإشعارات (بعد الفلتر)'],[fmt(sum(view))||'0','إجمالي القيمة'],[op.length,'غير مسدد'],[fmt(sum(op))||'0','قيمة غير المسدد'],[new Set(view.map(r=>r.code)).size,'عدد العملاء']].map(([v,l])=>`<div class="st"><b>${v}</b><span>${l}</span></div>`).join('');
 $('pg').textContent=`صفحة ${page+1} من ${tot} — عرض ${sl.length} من ${view.length}`;
 $('pv').disabled=page===0;$('nx').disabled=page>=tot-1;upc();
}
function upc(){$('pc').textContent=sel.size;$('pc2').textContent=sel.size;$('selc').textContent=sel.size?`محدد: ${sel.size}`:''}

function buildPages(rs){
 let st=document.getElementById('rcss');if(!st){st=document.createElement('style');st.id='rcss';st.textContent=RCSS;document.head.appendChild(st)}

 while(i<rs.length||!pages.length){

  pa.appendChild(div);const tb=div.querySelector('table.main tbody'),tbl=div.querySelector('table.main'),lim=PH-70;let n=0;

 pages.forEach((d,k)=>d.querySelector('.pn').textContent=`صفحة${k+1} من ${pages.length}`);
 return pages;
}

async function toCanvas(el){
 const W=PW*2,H=PH*2;
 try{if(window.html2canvas){return await html2canvas(el,{scale:2,backgroundColor:'#fff',useCORS:true,logging:false,width:PW,height:PH,windowWidth:PW,windowHeight:PH,x:0,y:0,scrollX:0,scrollY:0})}}catch(e1){console.warn('html2canvas failed',e1)}
 const x=new XMLSerializer().serializeToString(el);
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${PW} ${PH}"><foreignObject width="${PW}" height="${PH}"><div xmlns="http://www.w3.org/1999/xhtml"><style><![CDATA[${RCSS}]]></style>${x}</div></foreignObject></svg>`;
 const img=new Image();
 await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('svg render failed'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
 const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);g.drawImage(img,0,0,W,H);return c;
}
async function saveBlob(blob,name){
 let dl=null;try{if(typeof claude!=='undefined'&&claude&&claude.use)dl=await claude.use('downloads')}catch(e){}
 if(dl){await dl.save({filename:name,data:blob});return}
 if(window.showSaveFilePicker){try{const h=await showSaveFilePicker({suggestedName:name,types:[{description:'PDF',accept:{'application/pdf':['.pdf']}}]});const w=await h.createWritable();await w.write(blob);await w.close();return}catch(e){if(e&&e.name==='AbortError')return}}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},5000);
}
async function savePdf(){
 const rs=selRows();if(!rs.length)return;const btn=$('pdf'),old=btn.innerHTML;btn.disabled=true;btn.textContent='جاري التجهيز…';
 try{
  const pages=buildPages(rs);await waitImgs($('pa'));if(document.fonts&&document.fonts.ready)await document.fonts.ready;
  const {jsPDF}=window.jspdf,doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a3',compress:true});
  for(let k=0;k<pages.length;k++){const c=await toCanvas(pages[k]);if(k)doc.addPage('a3','landscape');doc.addImage(c.toDataURL('image/jpeg',.95),'JPEG',0,0,420,297,undefined,'FAST')}
  $('pa').innerHTML='';
  const nm=[...new Set(rs.map(r=>r.cust))];
  await saveBlob(doc.output('blob'),`اشعارات_${nm.length===1?nm[0]:'عملاء'}_${new Date().toISOString().slice(0,10)}.pdf`);
 }catch(e){console.error(e);if(!e||e.code!=='declined')alert('تعذر تنزيل الـ PDF ('+((e&&(e.code||e.message))||e)+')\nبديل: اضغط "طباعة المحدد" واختار Save as PDF.')}
 finally{btn.disabled=false;btn.innerHTML=old;upc()}
}
// saved keywords
let saved=[];
try{saved=JSON.parse(localStorage.getItem('savedKw')||'[]')}catch(e){}
function persist(){try{localStorage.setItem('savedKw',JSON.stringify(saved))}catch(e){}}
function drawSaved(){const el=$('saved');el.innerHTML=saved.map((w,i)=>`<span class="chip ${kws.has('w:'+w)?'on':''}" data-w="${esc(w)}">${esc(w)}<i data-x="${i}">✕</i></span>`).join('');
 el.querySelectorAll('.chip').forEach(c=>c.onclick=e=>{if(e.target.dataset.x!==undefined){const w=saved[+e.target.dataset.x];saved.splice(+e.target.dataset.x,1);kws.delete('w:'+w);persist();drawSaved();apply();return}const k='w:'+c.dataset.w;kws.has(k)?kws.delete(k):kws.add(k);drawSaved();apply()})}
function addKw(){const w=$('kw').value.trim();if(!w)return;if(!saved.includes(w))saved.push(w);persist();kws.add('w:'+w);$('kw').value='';drawSaved();apply()}
$('kw').addEventListener('keydown',e=>{if(e.key==='Enter')addKw()});$('addkw').onclick=addKw;$('pdf').onclick=savePdf;
document.querySelectorAll('.chip[data-k]').forEach(c=>c.onclick=()=>{const k=c.dataset.k;kws.has(k)?kws.delete(k):kws.add(k);c.classList.toggle('on');apply()});
['q','fs','fm','d1','d2','so','km'].forEach(id=>$(id).addEventListener('input',apply));
$('reset').onclick=()=>{['q','kw','d1','d2'].forEach(i=>$(i).value='');$('fs').value='all';$('fm').value='';$('km').value='in';kws.clear();document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on'));drawSaved();apply()};
$('tb').addEventListener('change',e=>{const i=+e.target.dataset.i;e.target.checked?sel.add(i):sel.delete(i);e.target.closest('tr').classList.toggle('sel',e.target.checked);upc()});
$('chPage').onchange=e=>{view.slice(page*PS,page*PS+PS).forEach(r=>e.target.checked?sel.add(r.i):sel.delete(r.i));render()};
$('selAll').onclick=()=>{view.forEach(r=>sel.add(r.i));render()};
$('selNone').onclick=()=>{sel.clear();render()};
$('pv').onclick=()=>{page--;render();scrollTo(0,0)};$('nx').onclick=()=>{page++;render();scrollTo(0,0)};
$('print').onclick=printSel;
$('theme').onclick=()=>{const d=document.documentElement,dk=getComputedStyle(d).getPropertyValue('--bg').trim()==='#12161d';d.dataset.theme=dk?'light':'dark'};
$('up').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true}),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
 const raw=a.slice(3).filter(r=>r[13] instanceof Date).map(r=>r.slice(0,16).map(v=>v instanceof Date?v.toISOString():(v===null?'':v)));
 raw.forEach(r=>{r[13]=new Date(r[13]).toISOString()});
 if(!raw.length){alert('الملف مش بنفس تنسيق التقرير');return}
 $('src').textContent=`المصدر: ${f.name} — ${raw.length} سجل`;build(raw)};
$('src').textContent=`المصدر: ${META.file} — ${RAW.length} سجل — يمكنك رفع شيت جديد بنفس التنسيق من زر "رفع شيت جديد"`;
drawSaved();build(RAW);
</script>
